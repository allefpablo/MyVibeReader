spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:myvibereader}}
    username: ${SPRING_DATASOURCE_USERNAME:myvibereader}
    password: ${SPRING_DATASOURCE_PASSWORD:myvibereader}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-use-a-256-bit-secret}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}  # 24 hours
  storage:
    path: ${STORAGE_PATH:./storage}
