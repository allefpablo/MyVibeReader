# ==============================================================================
# MyVibeReader — Render Infrastructure as Code Blueprint
# Provisions Spring Boot REST API Web Service + Managed PostgreSQL Database
# ==============================================================================

services:
  # ──────────────────────────────────────────────────────────────────────────
  # Web Service: Spring Boot REST API
  # ──────────────────────────────────────────────────────────────────────────
  - type: web
    name: myvibereader-server
    runtime: docker
    rootDir: server
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /actuator/health
    autoDeploy: true

    envVars:
      - key: PORT
        value: 10000
      - key: SERVER_PORT
        value: 10000
      - key: SPRING_PROFILES_ACTIVE
        value: production
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update

      # Database binding from Render managed PostgreSQL
      - key: DB_HOST
        fromDatabase:
          name: myvibereader-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: myvibereader-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: myvibereader-db
          property: database
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: myvibereader-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: myvibereader-db
          property: password

      # Cryptographic security
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MS
        value: 86400000

      # S3 Object Storage (prompted during Blueprint setup)
      - key: S3_BUCKET_NAME
        sync: false
      - key: AWS_REGION
        value: us-east-1
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: S3_ENDPOINT
        value: ""

      # Client CORS rules
      - key: CORS_ALLOWED_ORIGINS
        value: "tauri://localhost,https://tauri.localhost,http://tauri.localhost"

# ──────────────────────────────────────────────────────────────────────────
# Managed PostgreSQL Database
# ──────────────────────────────────────────────────────────────────────────
databases:
  - name: myvibereader-db
    databaseName: myvibereader
    user: myvibereader
    plan: free
    region: oregon
